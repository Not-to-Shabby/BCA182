# Zephyr RTOS Configuration - Laboratory 4 Edge AI Appliance Cycle Monitor
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console and Serial (USART1 via ST-LINK VCP, routed by board overlay)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Core Kernel Subsystems
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_IRQ_OFFLOAD=y

# Hardware Drivers
CONFIG_GPIO=y
CONFIG_DMA=y

# Standard C Library
CONFIG_NEWLIB_LIBC=y

# Hardware FPU for single-precision vibration feature extraction and inference
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# microSD card event logging (Zephyr FatFs on SDMMC)
CONFIG_FILE_SYSTEM=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_SS=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
