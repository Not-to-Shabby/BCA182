apiVersion: 1

datasources:
  - name: BenchWatch-InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: bca182
      defaultBucket: benchwatch
      tlsSkipVerify: true
    secureJsonData:
      token: benchwatch-lab-token-change-me
