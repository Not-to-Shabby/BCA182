# Zephyr RTOS Configuration - Laboratory 2 Personal MP3 Player
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console and Serial
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Core Kernel Subsystems
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Hardware Drivers
CONFIG_GPIO=y

# Power Management
CONFIG_PM=y

# Standard C / C++ Library
CONFIG_NEWLIB_LIBC=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# Disk Access & SDMMC Driver
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# FAT Filesystem (FatFs) with exFAT & Formatting (mkfs) Support
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_MAX_SS=4096
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y

# USB Device Stack & Mass Storage Class (SD Card Reader)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="RT-Spark SD Reader"
CONFIG_USB_DEVICE_PID=0x5721
CONFIG_USB_DEVICE_VID=0x0483
CONFIG_USB_MASS_STORAGE=y
CONFIG_MASS_STORAGE_DISK_NAME="SD"
CONFIG_MASS_STORAGE_INQ_VENDOR_ID="ZEPHYR  "
CONFIG_MASS_STORAGE_INQ_PRODUCT_ID="ZEPHYR USB DISK "
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_SN="000000000001"
