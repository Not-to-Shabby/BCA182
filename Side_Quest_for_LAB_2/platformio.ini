; PlatformIO Project Configuration File
; RT-Spark Standalone MIDI Karaoke Player (Side Quest for Laboratory Activity 2)

[platformio]
default_envs = black_f407zg

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = zephyr
upload_protocol = stlink
monitor_port = COM7
monitor_speed = 115200
build_flags =
    -Iinclude
    -O2

check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --suppress=unusedFunction --inline-suppr

; Host tests build for the PC only.
test_ignore = test_*

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -Iinclude
    -Itest/test_catalog/stubs
