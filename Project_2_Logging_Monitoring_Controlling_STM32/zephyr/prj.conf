# Zephyr RTOS Configuration - Project 2 "BenchWatch"
# Logging, Monitoring, and Controlling (MQTT -> InfluxDB -> Grafana)
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console and Serial (USART1 via ST-LINK VCP, routed by board overlay)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Core Kernel Subsystems
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y

# Hardware Drivers
CONFIG_GPIO=y
CONFIG_DMA=y

# Standard C Library
CONFIG_NEWLIB_LIBC=y

# Hardware FPU for sensor scaling and dashboard math
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Allow in-application Flash writes for saved Wi-Fi credentials
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_ARM_MPU=n

# Hardware RNG (STM32 RNG peripheral) seeds TCP ISNs and DHCP xids
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y

# Networking: RW007 is exposed as an Ethernet netif (src/rw007_netif.c)
# Configuration inherited from the verified Laboratory 3 RW007 stack.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4_ACD=n
CONFIG_NET_IPV4_IGMP=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1536
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6

# DNS resolver so the broker can be addressed by hostname as well as IP
CONFIG_DNS_RESOLVER=y

# MQTT client library (Zephyr mqtt_client over BSD sockets; no TLS - LAN broker)
CONFIG_MQTT_LIB=y

# microSD card optional log buffering (Zephyr FatFs on SDMMC)
CONFIG_FILE_SYSTEM=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_SS=4096

CONFIG_HEAP_MEM_POOL_SIZE=12288
