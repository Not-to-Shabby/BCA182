# Zephyr RTOS Configuration - Laboratory 3 Edge AI Activity Tracker
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console and Serial
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Core Kernel Subsystems
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Hardware Drivers
CONFIG_GPIO=y
CONFIG_PM=y

# Standard C Library
CONFIG_NEWLIB_LIBC=y

# Allow in-application Flash writes for saved Wi-Fi credentials
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_ARM_MPU=n

# Hardware FPU for TinyML single-precision float inference
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Hardware RNG (STM32 RNG peripheral) seeds TCP ISNs and DHCP xids
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y
CONFIG_XOSHIRO_RANDOM_GENERATOR=y

# Networking: RW007 is exposed as an Ethernet netif (src/rw007_netif.c)
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"
CONFIG_NET_IPV4_ACD=n
CONFIG_NET_IPV4_IGMP=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1536
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_NET_LOG=n
CONFIG_HEAP_MEM_POOL_SIZE=8192
