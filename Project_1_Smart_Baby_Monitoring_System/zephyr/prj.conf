# Zephyr RTOS Configuration - Project 1 Smart Baby Monitoring System
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console and Serial (USART1 via ST-LINK VCP, routed by board overlay)
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Core Kernel Subsystems
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_IRQ_OFFLOAD=y

# Hardware Drivers
CONFIG_GPIO=y
CONFIG_DMA=y

# Standard C Library
CONFIG_NEWLIB_LIBC=y

# Hardware FPU for single-precision sensor feature extraction and inference
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Power management must stay off: STOP mode powers down PLLI2S and stalls the
# I2S DMA streams (audio capture/playback path) - Side_Quest precedent.
CONFIG_PM=n

# ------------------------------------------------------------------------------
# P4 Network transport (RW007 Wi-Fi -> L2 Ethernet -> DHCP -> MQTT)
# ------------------------------------------------------------------------------
# The RW007 SPI Wi-Fi module (LAB_3 native driver, src/rw007_wifi.c) is exposed
# as an Ethernet netif (src/rw007_netif.c), so the stock Zephyr IPv4/UDP/TCP/
# DHCP/socket stack runs on top of it. Lean pools: the audio ring + demo record
# buffers were moved/shrunk out of main SRAM (audio_capture.c DTCM migration)
# to fund this block -- tune DOWN at link time if RAM overflows.

# Hardware RNG (STM32 RNG peripheral, rng node enabled in the board overlay)
# seeds TCP ISNs and DHCP transaction ids
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y

# Network core + L2 (RW007 registers as an Ethernet device)
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y

# Link event management (IP-acquire callback, carrier up/down supervision)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1536
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048

# Lean packet pools (MQTT + DHCP client sockets + portal DNS/listen/client).
# The DHCPv4 server + portal sockets pushed RAM past the link ceiling, so the
# prescribed shrink was applied: pkt slabs 6->4 and buf data 512->384 (the
# portal streams small chunks; MQTT payloads are << 384 B).
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=384
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=8
CONFIG_DNS_RESOLVER=y

# P4 captive portal: Zephyr DHCPv4 server on the SoftAP netif (leases
# 192.168.4.2..5, hands the phone the portal address as its DNS server).
# The wildcard captive-DNS responder itself is the portal's UDP :53 socket.
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=4
CONFIG_NET_DHCPV4_SERVER_OPTION_DNS_ADDRESS="192.168.4.1"

# MQTT v3.1.1 client library (used by mqtt_task.c against a LAN broker)
CONFIG_MQTT_LIB=y

# Allow in-application Flash writes (wifi_storage.c, sector 11; ARM_MPU off
# per the LAB_3 precedent so the direct FLASH register access is permitted)
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_ARM_MPU=n

# Heap for the socket/DNS/mqtt-library allocations
CONFIG_HEAP_MEM_POOL_SIZE=12288

# Hardware watchdog (IWDG): converts the observed first-window wedge
# into a self-recovery reset (spec: watchdog + sensible fault responses)
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
