; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = black_f407zg

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = zephyr
upload_protocol = stlink
monitor_port = COM7
monitor_speed = 115200
build_flags =
    -Iinclude
    -Ireference
    -O2

; Static analysis configuration for project code
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --suppress=unusedFunction --suppress=*:src/helix/* --inline-suppr

; Unit tests run on PC via [env:native], not on the target board
test_ignore = test_player_logic

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<player_logic.c>
build_flags = -Iinclude

