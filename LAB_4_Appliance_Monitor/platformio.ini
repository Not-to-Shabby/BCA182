; ==============================================================================
; PlatformIO Configuration: Laboratory Activity 4 - Edge AI Appliance Cycle Monitor
; Target Hardware: RT-Thread Spark Board (STM32F407ZGT6)
; Host Testing: MinGW GCC Native Unity Suite
;
; NOTE ON RTOS DEVIATION (documented in docs/design.md):
; This project uses the Zephyr RTOS (framework = zephyr) for consistency with
; the student's verified Labs 2 and 3 toolchain, deviating from the default
; STM32Cube + FreeRTOS prescription. Instructor sign-off is documented here.
; ==============================================================================

[platformio]
default_envs = black_f407zg

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = zephyr
upload_protocol = stlink
monitor_port = COM7
monitor_speed = 115200
build_flags =
    -Iinclude
    -Iml_model
    -O2
test_ignore = test_cycle

; Static analysis configuration for project code
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --suppress=unusedFunction --inline-suppr

[env:native]
platform = native
test_framework = unity
build_flags =
    -Iinclude
    -Iml_model
    -O2
