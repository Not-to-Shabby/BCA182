; ==============================================================================
; PlatformIO Configuration: Project 2 - Logging, Monitoring, and Controlling
; ("BenchWatch" laboratory workbench monitor)
; Target Hardware: RT-Thread Spark Board (STM32F407ZGT6)
; Host Testing: MinGW GCC Native Unity Suite
;
; NOTE ON RTOS DEVIATION (documented in docs/plan.md, section 2):
; This project uses the Zephyr RTOS (framework = zephyr) so the verified RW007
; SPI Wi-Fi driver, sensor drivers, and build toolchain from Labs 2-4 can be
; reused, deviating from the assignment's default STM32Cube + FreeRTOS
; prescription. The deviation and its justification are documented in docs/plan.md.
; ==============================================================================

[platformio]
default_envs = black_f407zg

[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = zephyr
upload_protocol = stlink
monitor_port = COM7
monitor_speed = 115200
build_flags =
    -Iinclude
    -O2

; Static analysis configuration for project code
check_tool = cppcheck
check_skip_packages = yes
check_flags =
    cppcheck: --suppress=unusedFunction --inline-suppr

[env:native]
platform = native
test_framework = unity
build_flags =
    -Iinclude
    -O2
