# Zephyr RTOS Configuration - Laboratory 2 Personal MP3 Player
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console and Serial
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Core Kernel Subsystems
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Hardware Drivers
CONFIG_GPIO=y

# Power management stays off: STOP mode powers down PLLI2S, which stalls the I2S3 audio DMA.
CONFIG_PM=n

# Standard C / C++ Library
CONFIG_NEWLIB_LIBC=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_DMA=y

# minimp3 needs hardware float; the audio engine timer also uses float in ISR context.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_MAX_SS=4096
