[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200

build_flags =
    -I include
    -I lib/FreeRTOS/include
    -I lib/FreeRTOS/portable/GCC/ARM_CM3

; Static analysis configuration for project code
check_tool = cppcheck
check_skip_packages = yes
check_flags = cppcheck: --suppress=unusedFunction --inline-suppr

; Unit tests run on PC via [env:native], not on the target board
test_ignore = test_logic

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<logic.c>
build_flags = -I include
lib_ignore = FreeRTOS
