# Zephyr RTOS Configuration - Laboratory 2 Personal MP3 Player
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console and Serial
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Core Kernel Subsystems
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Hardware Drivers
CONFIG_GPIO=y

# Power Management
CONFIG_PM=y

# Standard C / C++ Library
CONFIG_NEWLIB_LIBC=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
