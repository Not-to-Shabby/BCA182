# Zephyr RTOS Configuration - Laboratory 3 Edge AI Activity Tracker
# Target: RT-Thread Spark Development Board (STM32F407ZGT6)

# Console and Serial
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Core Kernel Subsystems
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Hardware Drivers
CONFIG_GPIO=y
CONFIG_PM=y

# Standard C Library
CONFIG_NEWLIB_LIBC=y

# Hardware FPU for TinyML single-precision float inference
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
