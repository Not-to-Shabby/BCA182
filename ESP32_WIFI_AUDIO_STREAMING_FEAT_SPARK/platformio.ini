; PlatformIO Project Configuration File
; Project: ESP32_WIFI_AUDIO_STREAMING_FEAT_SPARK
; Board: ESP32-S3 Super Mini (ESP32-S3FH4R2, 4MB Flash, 2MB PSRAM)
; Target Integration: RT-Thread RT-Spark Development Board (STM32F407)

[platformio]
default_envs = esp32s3_super_mini

[env:esp32s3_super_mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM9
upload_speed = 921600
monitor_port = COM9
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_WIFI_AUDIO_UART_BAUD=2000000
    -DCONFIG_WIFI_DEFAULT_AP_SSID=\"RT-Spark-Audio\"
    -DCONFIG_WIFI_DEFAULT_AP_PASS=\"12345678\"
