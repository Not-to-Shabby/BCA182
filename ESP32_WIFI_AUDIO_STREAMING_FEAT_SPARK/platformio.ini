; PlatformIO Project Configuration File
; Project: ESP32_WIFI_AUDIO_STREAMING_FEAT_SPARK
; Microcontroller: Espressif ESP32-S3 (Dual-Core Xtensa LX7 @ 240 MHz)
; RTOS: Zephyr RTOS (v3.x)
; Target Integration: RT-Thread RT-Spark Development Board (STM32F407)

[platformio]
default_envs = esp32s3_devkitc

[env:esp32s3_devkitc]
platform = espressif32
framework = zephyr
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags =
    -DCONFIG_WIFI_AUDIO_UART_BAUD=2000000
    -DCONFIG_WIFI_AUDIO_SAMPLE_RATE=44100
    -DCONFIG_WIFI_DEFAULT_AP_SSID=\"RT-Spark-Audio\"
    -DCONFIG_WIFI_DEFAULT_AP_PASS=\"12345678\"
